<!DOCTYPE html>
<html>
<head><title>StepTalk Bridge</title></head>
<body>
<script>
const WS_URL = location.origin.replace(/^http/, 'ws') + '/bridge';
let ws;
let pc;
let audioContext;
let destination;
let currentCallId = null;
let toneNode = null;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    console.log('Bridge connected');
    ws.send(JSON.stringify({ type: 'ready' }));
  };
  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    try {
      await handleMessage(msg);
    } catch (e) {
      console.error('Handle error:', e);
      ws.send(JSON.stringify({ type: 'error', error: e.message, callId: currentCallId }));
    }
  };
  ws.onclose = () => {
    console.log('Bridge disconnected');
    setTimeout(connect, 1000);
  };
}

async function handleMessage(msg) {
  console.log('Received:', msg.type);
  if (msg.type === 'offer') {
    await setupPeerConnection(msg.sdp, msg.callId);
  } else if (msg.type === 'audio') {
    playAudio(msg.pcm, msg.sampleRate, msg.channels);
  } else if (msg.type === 'stop') {
    if (pc) { pc.close(); pc = null; }
    stopTone();
  }
}

function startTone() {
  if (!audioContext || toneNode) return;
  const osc = audioContext.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 300;
  const gain = audioContext.createGain();
  gain.gain.value = 0.01;
  osc.connect(gain);
  gain.connect(destination);
  osc.start();
  toneNode = { osc, gain };
  console.log('Tone started (300Hz, very quiet)');
}

function stopTone() {
  if (toneNode) {
    try { toneNode.osc.stop(); } catch (e) {}
    toneNode = null;
  }
}

async function setupPeerConnection(offerSdp, callId) {
  if (pc) { pc.close(); pc = null; }
  stopTone();
  currentCallId = callId;

  if (!audioContext || audioContext.state === 'closed') {
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  }
  if (audioContext.state === 'suspended') {
    await audioContext.resume();
  }
  destination = audioContext.createMediaStreamDestination();

  startTone();

  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ],
    iceTransportPolicy: 'relay'
  });

  const audioTrack = destination.stream.getAudioTracks()[0];
  pc.addTrack(audioTrack, destination.stream);

  pc.ontrack = (event) => {
    console.log('ontrack fired, kind:', event.track.kind, 'streams:', event.streams.length);
    const stream = event.streams[0];
    if (!stream) return;
    captureRemoteAudio(stream);
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    console.log('ICE:', state);
    ws.send(JSON.stringify({ type: 'ice', state, callId }));
  };

  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    console.log('Connection:', state);
    ws.send(JSON.stringify({ type: 'connection', state, callId }));
  };

  await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: offerSdp }));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  console.log('Sending answer');
  ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp, callId }));
}

function captureRemoteAudio(stream) {
  if (!stream) return;
  console.log('Tracks in stream:', stream.getTracks().length);
  const remoteTrack = stream.getAudioTracks()[0];
  if (remoteTrack) {
    console.log('Remote track: enabled=' + remoteTrack.enabled + ' muted=' + remoteTrack.muted + ' ready=' + remoteTrack.readyState);
  }

  try {
    const source = audioContext.createMediaStreamSource(stream);
    const processor = audioContext.createScriptProcessor(4096, 1, 1);
    let count = 0;

    processor.onaudioprocess = (e) => {
      const inputData = e.inputBuffer.getChannelData(0);
      let sum = 0;
      let max = 0;
      for (let i = 0; i < inputData.length; i++) {
        const v = Math.abs(inputData[i]);
        sum += v;
        if (v > max) max = v;
      }
      const avg = sum / inputData.length;

      count++;
      if (count <= 5 || count % 100 === 0) {
        console.log('Capture #' + count + ' avg=' + avg.toFixed(6) + ' max=' + max.toFixed(6));
      }

      if (avg < 0.001) return;

      const int16 = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        const s = Math.max(-1, Math.min(1, inputData[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const bytes = new Uint8Array(int16.buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      ws.send(JSON.stringify({
        type: 'captured',
        pcm: btoa(binary),
        sampleRate: audioContext.sampleRate,
        callId: currentCallId
      }));
    };

    source.connect(processor);
    processor.connect(audioContext.destination);
    console.log('Audio capture connected');
  } catch (e) {
    console.error('Capture error:', e);
  }
}

function playAudio(pcmBase64, sampleRate, channels) {
  if (!audioContext) return;
  stopTone();
  if (audioContext.state === 'suspended') audioContext.resume();

  const binary = atob(pcmBase64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768.0;
  }

  console.log('Playing', float32.length, 'samples');
  const frameSize = 960;
  let offset = 0;

  function playNext() {
    if (offset >= float32.length || !pc) {
      startTone();
      return;
    }
    const end = Math.min(offset + frameSize, float32.length);
    const chunk = float32.slice(offset, end);
    const buffer = audioContext.createBuffer(1, chunk.length, sampleRate || 48000);
    buffer.getChannelData(0).set(chunk);
    const src = audioContext.createBufferSource();
    src.buffer = buffer;
    src.connect(destination);
    src.onended = playNext;
    src.start();
    offset = end;
  }
  playNext();
}

connect();
</script>
</body>
</html>
