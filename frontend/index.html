<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Phone Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </div>
                <h1>AI Voice Assistant</h1>
            </div>
            <div class="header-right">
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span>Connected</span>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Dial Pad Panel -->
            <div class="panel dial-panel">
                <h2>Make a Call</h2>
                <div class="dial-display">
                    <input type="tel" id="dialNumber" placeholder="+1 (555) 123-4567" autocomplete="off">
                </div>
                <div class="dial-pad">
                    <button class="dial-btn" data-digit="1">1</button>
                    <button class="dial-btn" data-digit="2">2<span>ABC</span></button>
                    <button class="dial-btn" data-digit="3">3<span>DEF</span></button>
                    <button class="dial-btn" data-digit="4">4<span>GHI</span></button>
                    <button class="dial-btn" data-digit="5">5<span>JKL</span></button>
                    <button class="dial-btn" data-digit="6">6<span>MNO</span></button>
                    <button class="dial-btn" data-digit="7">7<span>PQRS</span></button>
                    <button class="dial-btn" data-digit="8">8<span>TUV</span></button>
                    <button class="dial-btn" data-digit="9">9<span>WXYZ</span></button>
                    <button class="dial-btn dial-btn-star" data-digit="*">*</button>
                    <button class="dial-btn" data-digit="0">0<span>+</span></button>
                    <button class="dial-btn dial-btn-hash" data-digit="#">#</button>
                </div>
                <div class="dial-actions">
                    <button class="btn-call" id="btnCall" title="Call">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        Call
                    </button>
                    <button class="btn-backspace" id="btnBackspace" title="Delete">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                            <line x1="18" y1="9" x2="12" y2="15"/>
                            <line x1="12" y1="9" x2="18" y2="15"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Active Calls Panel -->
            <div class="panel calls-panel">
                <h2>Active Calls</h2>
                <div class="calls-list" id="callsList">
                    <div class="no-calls">No active calls</div>
                </div>
            </div>

            <!-- Call Detail Panel (shown when a call is selected) -->
            <div class="panel detail-panel hidden" id="detailPanel">
                <div class="detail-header">
                    <button class="btn-back" id="btnBack">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </button>
                    <h2 id="detailNumber">Call Details</h2>
                    <div class="detail-status" id="detailStatus">Active</div>
                </div>
                <div class="detail-info">
                    <div class="detail-row">
                        <span class="label">Direction</span>
                        <span id="detailDirection">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">From</span>
                        <span id="detailFrom">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">To</span>
                        <span id="detailTo">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Duration</span>
                        <span id="detailDuration">0:00</span>
                    </div>
                </div>
                <div class="detail-transcript" id="detailTranscript">
                    <div class="transcript-placeholder">Conversation will appear here...</div>
                </div>
                <div class="detail-actions">
                    <button class="btn-hangup" id="btnHangup">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91"/>
                        </svg>
                        End Call
                    </button>
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div class="modal hidden" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="btn-close-modal" id="btnCloseSettings">&times;</button>
                </div>
                <div class="modal-body">
                    <label>
                        Your Bandwidth Phone Number
                        <input type="text" id="settingsFromNumber" readonly>
                    </label>
                    <label>
                        Base URL (for webhooks)
                        <input type="text" id="settingsBaseUrl" placeholder="https://your-app.onrender.com">
                    </label>
                    <button class="btn-save" id="btnSaveSettings">Save</button>
                </div>
            </div>
        </div>

        <div class="toast hidden" id="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
